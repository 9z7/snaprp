<!DOCTYPE html>
<html>
<head>
    <title>SnapRP</title>
    <link rel="stylesheet" type="text/css" href="css/style.css">
</head>
<body>
    <div id="phone-container">
        <div id="screen">
            <div id="app">
                <div id="content">
                    <div class="tab-content" id="stories-content">
                        <!-- Story Feed -->
                        <div class="story">
                            <div class="story-header">
                                <div class="story-avatar"></div>
                                <div class="story-username">Jules</div>
                            </div>
                            <img class="story-image" src="https://via.placeholder.com/350x500" alt="Story Image">
                            <div class="story-actions">
                                <span class="story-action">❤️</span>
                                <span class="story-action">💬</span>
                            </div>
                            <div class="story-likes">123 likes</div>
                            <div class="story-comments">View all 5 comments</div>
                        </div>
                        <div class="story">
                            <div class="story-header">
                                <div class="story-avatar"></div>
                                <div class="story-username">AnotherUser</div>
                            </div>
                            <img class="story-image" src="https://via.placeholder.com/350x500" alt="Story Image">
                            <div class="story-actions">
                                <span class="story-action">❤️</span>
                                <span class="story-action">💬</span>
                            </div>
                            <div class="story-likes">456 likes</div>
                            <div class="story-comments">View all 10 comments</div>
                        </div>
                    </div>
                    <div class="tab-content" id="profile-content">
                        <!-- Profile -->
                        <div class="profile-header">
                            <div class="profile-avatar"></div>
                            <div class="profile-username">Jules</div>
                            <div class="profile-status">"Enjoying the sun!"</div>
                        </div>
                        <div class="profile-streaks">
                            🔥 <strong>Daily Streak:</strong> 5
                        </div>
                    </div>
                </div>
                <div id="camera-button">📷</div>
                <div id="tabs">
                    <div class="tab active" id="stories-tab">📸</div>
                    <div class="tab" id="profile-tab">👤</div>
                </div>
            </div>
        </div>
    </div>
    <script src="js/script.js"></script>
</body>
</html>
